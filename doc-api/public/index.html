<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Analysis</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow-md w-2/3">
    <!-- Increased width to 2/3 -->
    <h1 class="text-2xl font-bold mb-4">Upload Document for Analysis</h1>
    <form id="uploadForm" class="flex items-center space-x-4">
      <!-- Flexbox for side-by-side layout -->
      <input type="file" name="document" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"
        class="mb-4 p-2 border border-gray-300 rounded w-full" />
      <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded">
        Analyze Document
      </button>
    </form>
    <div id="result" class="mt-4"></div>
  </div>

  <script>
    document
      .getElementById("uploadForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        const formData = new FormData(this);
        try {
          const response = await fetch("/analyze-document", {
            method: "POST",
            body: formData,
          });
          if (!response.ok) {
            throw new Error("Network response was not ok");
          }
          const result = await response.json();
          console.log(result);
          displayResult(result);
        } catch (error) {
          document.getElementById("result").innerText =
            "Error analyzing document: " + error.message;
        }
      });

    function displayResult(result) {
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";
      if (result.length === 0) {
        resultDiv.innerText = "No content found in the document.";
        return;
      }
      result.forEach((page) => {
        const pageDiv = document.createElement("div");
        pageDiv.className = "mb-4 p-4 border rounded bg-gray-50";
        pageDiv.innerHTML =
          `<h2 class="font-semibold">Page ${page.pageNumber}</h2>` +
          page.lines.map((line) => `<p>${line}</p>`).join("");
        resultDiv.appendChild(pageDiv);
      });
    }
  </script>
</body>

</html>
